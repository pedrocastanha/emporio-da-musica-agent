[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música (Artefact AI Engineer case)"
requires-python = ">=3.10"

[project.scripts]
emporio = "emporio.interfaces.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"emporio.agent" = ["*.md"]
"emporio.evals.datasets" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
